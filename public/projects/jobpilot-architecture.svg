<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Arial, sans-serif">
  <rect width="1200" height="560" fill="#0b0e13"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4ade80"/>
    </marker>
  </defs>
  <!-- lanes -->
  <text x="60" y="50" fill="#86efac" font-size="20" font-weight="bold">JobPilot — System Architecture</text>
  <!-- UI -->
  <rect x="60" y="90" width="220" height="90" rx="14" fill="#12161f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="170" y="128" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Streamlit UI</text>
  <text x="170" y="152" text-anchor="middle" fill="#94a3b8" font-size="13">Upload resume · track apps</text>
  <!-- API -->
  <rect x="380" y="90" width="220" height="90" rx="14" fill="#12161f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="490" y="128" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">FastAPI Backend</text>
  <text x="490" y="152" text-anchor="middle" fill="#94a3b8" font-size="13">JWT auth · REST endpoints</text>
  <!-- Agent -->
  <rect x="700" y="70" width="440" height="200" rx="14" fill="#0f2418" stroke="#34d399" stroke-width="1.5"/>
  <text x="920" y="100" text-anchor="middle" fill="#86efac" font-size="16" font-weight="bold">LangGraph Agent — 8 nodes</text>
  <g fill="#12161f" stroke="#4ade80">
    <rect x="720" y="115" width="120" height="34" rx="8"/>
    <rect x="850" y="115" width="120" height="34" rx="8"/>
    <rect x="980" y="115" width="140" height="34" rx="8"/>
    <rect x="720" y="160" width="120" height="34" rx="8"/>
    <rect x="850" y="160" width="120" height="34" rx="8"/>
    <rect x="980" y="160" width="140" height="34" rx="8"/>
    <rect x="785" y="205" width="130" height="34" rx="8"/>
    <rect x="930" y="205" width="140" height="34" rx="8"/>
  </g>
  <g fill="#cbd5e1" font-size="12" text-anchor="middle">
    <text x="780" y="137">Job search</text>
    <text x="910" y="137">Matching</text>
    <text x="1050" y="137">Resume writing</text>
    <text x="780" y="182">Cover letters</text>
    <text x="910" y="182">Research</text>
    <text x="1050" y="182">Interview coach</text>
    <text x="850" y="227">Skill-gap scan</text>
    <text x="1000" y="227">Export DOCX/PDF</text>
  </g>
  <!-- Data row -->
  <rect x="380" y="330" width="220" height="90" rx="14" fill="#12161f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="490" y="368" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">ChromaDB</text>
  <text x="490" y="392" text-anchor="middle" fill="#94a3b8" font-size="13">RAG over user documents</text>
  <rect x="700" y="330" width="220" height="90" rx="14" fill="#12161f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="810" y="368" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Job APIs</text>
  <text x="810" y="392" text-anchor="middle" fill="#94a3b8" font-size="13">Live legal job listings</text>
  <rect x="990" y="330" width="150" height="90" rx="14" fill="#12161f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1065" y="368" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">LLM</text>
  <text x="1065" y="392" text-anchor="middle" fill="#94a3b8" font-size="13">Generation</text>
  <!-- Ops -->
  <rect x="60" y="330" width="220" height="90" rx="14" fill="#12161f" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="170" y="368" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Docker + pytest</text>
  <text x="170" y="392" text-anchor="middle" fill="#94a3b8" font-size="13">Deployment · test suite</text>
  <!-- arrows -->
  <g stroke="#4ade80" stroke-width="2" marker-end="url(#arr)" fill="none">
    <line x1="280" y1="135" x2="372" y2="135"/>
    <line x1="600" y1="135" x2="692" y2="135"/>
    <line x1="490" y1="180" x2="490" y2="322"/>
    <line x1="810" y1="278" x2="810" y2="322"/>
    <line x1="1000" y1="278" x2="1055" y2="322"/>
  </g>
  <text x="60" y="510" fill="#64748b" font-size="13">User → Streamlit → FastAPI → LangGraph agent orchestrates search, matching, writing, coaching — grounded by ChromaDB RAG and live job APIs.</text>
</svg>
